name: aurasound
description: AuraSound mobile app - starter project (ad-free music streaming).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Audio engine: ExoPlayer (Android) / AVPlayer (iOS) behind one Dart API.
  # Background playback and lock-screen controls need audio_service (see apps/mobile/README.md).
  just_audio: ^0.9.40

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
